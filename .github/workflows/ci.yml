name: CI

on:
  push:
    branches: ['**', '!dependabot/**']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: '版本 x.y.z+N（留空使用 pubspec.yaml）'
        type: string
        default: ''
      enable_android:
        description: Android arm64 APK
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        description: Flutter version (build name plus build number); empty uses pubspec.yaml.
        type: string
        default: ''
      build_targets:
        description: 'Optional JSON array limiting builds to a subset of the enabled platform targets.'
        type: string
        default: ''
      enable_android:
        description: Android arm64 APK.
        type: boolean
        default: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      version:
        description: Version used by every selected build.
        value: ${{ jobs.prepare.outputs.version }}

permissions:
  contents: read

env:
  # Match the official hosted source recorded in all five lockfiles.
  PUB_HOSTED_URL: https://pub.dev

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve version and platforms
        id: plan
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          BUILD_TARGETS: ${{ inputs.build_targets }}
          # Push/PR has no inputs; a reusable caller can explicitly pass false.
          ENABLE_ANDROID: ${{ !contains(toJSON(inputs), '"enable_android"') || inputs.enable_android }}
        run: ./tool/ci-build-plan.ps1

  lint:
    name: Format and analyze
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
          # flutter-action appends the hash of all pubspec.lock files.
          pub-cache-key: 'flutter-pub-:os:-:arch:-:version:'
      - name: Check formatting, analysis and packaging boundaries
        shell: pwsh
        run: ./tool/check.ps1 -Stage Lint -EnforceLockfile
      - name: Show pinned SDK formatting differences
        if: failure()
        shell: bash
        run: |
          dart format lib test integration_test packages/*/lib packages/*/test
          git diff -- '*.dart'

      - name: Check the mux shell helpers used by the Android build
        shell: bash
        run: |
          bash -n packages/bili_mux/tool/build.sh
          bash -n packages/bili_mux/tool/build-test-ffprobe.sh

  root-tests:
    name: Root app tests (shard ${{ matrix.shard }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
          pub-cache-key: 'flutter-pub-:os:-:arch:-:version:'
      - name: Run root app test shard
        shell: pwsh
        run: ./tool/check.ps1 -Stage RootTests -TotalShards 2 -ShardIndex ${{ matrix.shard }} -EnforceLockfile

  package-tests:
    name: Package tests
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
          pub-cache-key: 'flutter-pub-:os:-:arch:-:version:'
      - name: Run package tests covered outside the native mux job
        shell: pwsh
        run: ./tool/check.ps1 -Stage PackageTests -SkipMuxTests -EnforceLockfile

  # Preserve the existing required status and build dependency after splitting checks.
  check:
    name: Analyze and test
    if: ${{ always() }}
    needs: [lint, root-tests, package-tests, native-mux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check job to pass
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          ROOT_TEST_RESULT: ${{ needs.root-tests.result }}
          PACKAGE_TEST_RESULT: ${{ needs.package-tests.result }}
          MUX_TEST_RESULT: ${{ needs.native-mux.result }}
        run: |
          if [[ "$LINT_RESULT" != success || "$ROOT_TEST_RESULT" != success || "$PACKAGE_TEST_RESULT" != success || "$MUX_TEST_RESULT" != success ]]; then
            echo "::error::Checks did not all pass: lint=$LINT_RESULT root=$ROOT_TEST_RESULT packages=$PACKAGE_TEST_RESULT mux=$MUX_TEST_RESULT"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [prepare, check, native-mux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java for Android
        if: matrix.target == 'android-arm64'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          # Flutter plugins and the SDK also affect Android native dependencies.
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            **/pubspec.lock
            .flutter-version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          architecture: ${{ matrix.arch }}
          cache: true
          pub-cache-key: 'flutter-pub-:os:-:arch:-:version:'
      - name: Set up the Android mux compiler
        if: matrix.target == 'android-arm64'
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build and package preview
        timeout-minutes: 90
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID_PREVIEW_SIGNING: ${{ github.event_name == 'pull_request' }}
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
          ANDROID_SIGNING_CERTIFICATE_SHA256: ${{ vars.ANDROID_SIGNING_CERTIFICATE_SHA256 || '' }}
        run: ./tool/build-release.ps1 -Target $env:BUILD_TARGET -Version $env:BUILD_VERSION -AndroidPreviewSigning:($env:ANDROID_PREVIEW_SIGNING -eq 'true')
      - name: Upload packages and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BiliSail-${{ matrix.target }}-${{ needs.prepare.outputs.version }}-packages
          path: artifacts/${{ matrix.target }}/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  native-mux:
    name: MP4 and MKV native regression
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
          pub-cache-key: 'flutter-pub-:os:-:arch:-:version:'
      - name: Build and verify the isolated MP4 component
        shell: bash
        run: |
          bash packages/bili_mux/tool/build.sh linux-x64
          bash packages/bili_mux/tool/build-test-ffprobe.sh
          export BILI_MUX_LIBRARY="$PWD/packages/bili_mux/native/prebuilt/linux-x64/libbili_mux.so"
          export BILI_MUX_FFPROBE="$PWD/build/download_mux/test-ffprobe-linux-x64/ffprobe"
          cd packages/bili_mux
          flutter pub get --enforce-lockfile
          flutter test --no-pub
