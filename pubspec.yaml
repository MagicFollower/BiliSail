name: bilisail
description: BiliSail, a cross-platform third-party Bilibili client focused on the viewing experience, built with Flutter.
publish_to: none
version: 1.2.9+5

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.6'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_markdown_plus: 1.0.12
  go_router: 18.0.2
  drift: 2.35.2
  path: 1.9.1
  archive: 4.5.2
  crypto: 3.0.7
  xml: 6.6.1
  pointycastle: 4.0.0
  path_provider: 2.1.6
  file_selector: 1.1.0
  flutter_secure_storage: 11.2.0
  qr_flutter: 4.1.0
  window_manager: 0.5.2
  url_launcher: 6.3.3
  package_info_plus: 10.2.2
  audio_service: 0.18.19
  audio_service_mpris: 1.0.0-beta.3
  bili_api:
    path: packages/bili_api
  bili_player:
    path: packages/bili_player
  bili_danmaku:
    path: packages/bili_danmaku
  bili_mux:
    path: packages/bili_mux
  flutter_inappwebview: 6.2.0-beta.3
  # ── 合并取舍（并入 upstream/master a6194dc0）─────────────────────────
  # 本分支与上游在同一位置各自新增了一个依赖，职责不同、互不冲突，故两者都保留：
  #   1) liquid_dock_navi —— 本分支独有的「液态玻璃 dock」组件，来自同级独立仓库
  #      ../liquid_dock_navi（path 依赖）。它是本分支 UI 身份的核心，上游没有此包，
  #      必须保留，否则壳层 dock 无法编译。
  #   2) image_picker —— 上游本轮「动态发布」新增的依赖，用于 composing 时打开系统
  #      相册选图（上游提交 0cdd0eef）。采纳上游动态发布功能即需要它。
  # 一个服务本地 dock、一个服务上游动态发图，合并后共存，不互相替代。
  liquid_dock_navi:
    path: ../liquid_dock_navi
  image_picker: 1.2.4

# Keep core, video output and native library manifests on one reviewed fork commit.
dependency_overrides:
  # Retain the existing wakelock API and package_info_plus compatibility.
  wakelock_plus: 1.8.1
  # Linux uses QR login until the experimental WPE WebKit implementation has
  # a separately validated portable packaging path. No native WebView is linked.
  flutter_inappwebview_linux:
    path: linux/plugins/flutter_inappwebview_linux
  media_kit:
    git:
      url: https://github.com/CKopoer/media-kit.git
      path: media_kit
      ref: 302d60eedc55ca677e911e529569b1e14d8c2e7e
  media_kit_video:
    git:
      url: https://github.com/CKopoer/media-kit.git
      path: media_kit_video
      ref: 302d60eedc55ca677e911e529569b1e14d8c2e7e
  media_kit_libs_video:
    git:
      url: https://github.com/CKopoer/media-kit.git
      path: libs/universal/media_kit_libs_video
      ref: 302d60eedc55ca677e911e529569b1e14d8c2e7e
  media_kit_libs_android_video:
    git:
      url: https://github.com/CKopoer/media-kit.git
      path: libs/android/media_kit_libs_android_video
      ref: 302d60eedc55ca677e911e529569b1e14d8c2e7e
  media_kit_libs_windows_video:
    git:
      url: https://github.com/CKopoer/media-kit.git
      path: libs/windows/media_kit_libs_windows_video
      ref: 302d60eedc55ca677e911e529569b1e14d8c2e7e
  media_kit_libs_macos_video:
    git:
      url: https://github.com/CKopoer/media-kit.git
      path: libs/macos/media_kit_libs_macos_video
      ref: 302d60eedc55ca677e911e529569b1e14d8c2e7e
  media_kit_libs_ios_video:
    git:
      url: https://github.com/CKopoer/media-kit.git
      path: libs/ios/media_kit_libs_ios_video
      ref: 302d60eedc55ca677e911e529569b1e14d8c2e7e
  media_kit_libs_linux:
    git:
      url: https://github.com/CKopoer/media-kit.git
      path: libs/linux/media_kit_libs_linux
      ref: 302d60eedc55ca677e911e529569b1e14d8c2e7e

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  # The pinned video and native-library plugins share CocoaPods integration.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - packages/bili_mux/LICENSE-FFmpeg.txt
    - assets/icons/
    - assets/branding/app_icon.png
    - assets/branding/bilibili_pink.png
    - assets/branding/dsconfinement_icon.png
    - assets/branding/bilibili_pink_macos.icns
    - assets/branding/bilibili_LICENSE.md
    - assets/fonts/harmonyos_sans/LICENSE.txt
  fonts:
    - family: HarmonyOS Sans
      fonts:
        - asset: assets/fonts/harmonyos_sans/HarmonyOS_Sans_SC_Regular.ttf
          weight: 400
        - asset: assets/fonts/harmonyos_sans/HarmonyOS_Sans_SC_Medium.ttf
          weight: 500
        - asset: assets/fonts/harmonyos_sans/HarmonyOS_Sans_SC_Bold.ttf
          weight: 700
    - family: BiliIcons
      fonts:
        - asset: assets/fonts/biliicon.ttf
